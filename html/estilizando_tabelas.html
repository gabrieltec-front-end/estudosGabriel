<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table{
            width: 400px;
            border-collapse: collapse;
           
        }

        th,td{
            padding: 7px;
        }
        tr:hover{
            background-color: greenyellow;
        }

      
        th{
            border-top: 1px solid;
            border-bottom: 1px solid #777;
            text-align: left;
            font-size: 0.8em;
            letter-spacing: 0.2em;
            text-transform: uppercase;
         
        }

        .numero{
            text-align: right;
        }

        .color{
            background-color: #d3d0d0;
        }



    </style>
</head>
<body>

    <table>
        <tr>
            <th>Código</th>
            <th>Produto</th>
            <th class="numero">Preço</th>
        </tr>
        <tr>
            <td>001</td>
            <td>Notebook</td>
            <td class="numero">R$2500</td>
        </tr>
        <tr class="color">
            <td>002</td>
            <td>Celular</td>
            <td class="numero">R$1800</td>
        </tr>
        <tr>
            <td>003</td>
            <td>Video Game</td>
            <td class="numero">R$2100</td>
        </tr>
        <tr class="color">
            <td>004</td>
            <td>Bicicleta</td>
            <td class="numero">R4000</td>
        </tr>
    </table>
    
</body>
</html>
