<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #caixa{
            width: 300px;
            height: 300px;
            background-color: orange;
        }

        #caixa:hover{
            width: 400px;
            height: 300px;
            border: 1px solid green;
            background-color: red;
            transition: all 3s;
            border-radius: 400px;
        }

    </style>
</head>
<body>
    <h1>Transição</h1>
    <div id="caixa"></div>
    
</body>
</html>
