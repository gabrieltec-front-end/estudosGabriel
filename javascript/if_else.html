<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>If e else</title>
</head>
<body>
    <script>
        var nota = prompt("Digite o valor da nota")
        var media = 7

        if (nota>=media){
            document.write("Aprovado")
        }else{
            document.write("Reprovado")
        }



    </script>
    
</body>
</html>
