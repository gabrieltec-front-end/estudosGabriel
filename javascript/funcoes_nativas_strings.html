<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <script>

        //Testando as funções nativas de string
        var nome= "Gabriel de Oliveira Leal"

        document.write(nome.length)
        document.write("<br>")
        document.write(nome.charAt(5))
        document.write("<br>")
        document.write(nome.indexOf("l"))
        document.write("<br>")
        document.write(nome.replace("Gabriel","Amanda"))
        document.write("<br>")
        document.write(nome.substr(8,16))
        

    </script>
    
</body>
</html>
