<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <script>
        var nome=prompt("Digite o seu nome")
        var altura=prompt("Digite sua altura em centimetros")
        var peso = prompt("Digite o seu peso")

        altura=parseFloat(altura)
        peso=parseFloat(peso)
        altura= altura/100

        var m= peso/((altura*altura))

        if(m<16){
            document.write(nome+" Baixo peso muito grave")
        }
        else if(m>=16 && m<=16.99){
            document.write(nome+" Baixo peso grave")
        }
        else if(m>=17 && m<=18.49){
            document.write(nome+" Baixo peso")
        }
        else if(m>=18.50 && m<=24.99){
            document.write(nome+" Peso normal")
        }
        else if(m>=25 && m<=29.99){
            document.write(nome+" Sobrepeso")
        }
        else if(m>=30 && m<=34.99){
            document.write(nome+" Obeseidade grau 1")
        }
        else if(m>=35 && m<=39.99){
            document.write(nome+" Obesidade grau 2")
        }
        else {
            document.write(nome+" Obesidade grau 3")
        }


    </script>
</body>
</html>
