<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <script>
        var nota=prompt("Digite o valor da nota")
        var faltas=prompt("Digite quantas faltas ele possui")
        var media= 7
        var faltas2 = 15
        nota=parseFloat(nota)
        faltas=parseInt(faltas)
        if (nota>=media&&faltas<=faltas2){ 
            document.write('<h1>Você foi aprovado</h1>')
        }else{
            document.write("<h1>Você foi reprovado</h1>")
        }
         
    </script>
</body>
</html>
