<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <script>
        var x=10.380
       // var x=Math.ceil(10.380)//Objeto nativo do javaScript(Math) onde ocorre o arrendodamento do valor para cima
        document.write(x)
        document.write("<hr>")
        document.write(Math.floor(x))
        document.write("<hr>")
        document.write(Math.round(10.530))//Determina se vai arrendondar para cima ou para baixo de acordo com o valor depois da virgula
    </script>
    
</body>
</html>
