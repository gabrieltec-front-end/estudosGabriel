<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Click</title>
</head>
<body>
    <script>
        function mouse ( ){
            alert("Documento foi clicado")
        }

        function mouse1 (){
            document.write("<p>Você acabou de acessar o arquivo</p>")
        }
    </script>

    
    <div onmouseover="mouse1()" onclick="mouse()" style="width: 300px; height: 300px; background:black;"></style> ></style></div>
</body>
</html>
