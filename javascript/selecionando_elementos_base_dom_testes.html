<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script>

        function recuperarValor(){
            var caracter=document.getElementById("digitado").value
            console.log(caracter)
            //Limpando os valores do input
            document.getElementById("digitado").value=""
            caracter.trim()

            switch(caracter){
                case "0":
                case "1":
                case "2":
                case "3":
                case "4":
                case "5":
                case "6":
                case "7":
                case "8":
                case "9":
                    //Selecionando apenas os valores de numeros
                document.getElementById("apenas_numero").value+=caracter
                break;
                //Selecionando apenas os valores de letras as strings
                default:
                    document.getElementById("apenas_letras").value+=caracter

            }

            if(caracter=="ç"){
                document.getElementById("apenas_letras").value=""
                 document.getElementById("apenas_numero").value=""
            }
        }

    </script>
</head>

<body>
    <input type="text" placeholder="Digite aqui" id="digitado" onkeyup="recuperarValor()">
    <hr>
    <label>Letras:</label>
    <input type="text" disabled="disabled" id="apenas_letras">
    <label>Numeros:</label>
    <input type="text" disabled id="apenas_numero">  
   
</body>
</html>
