<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <script>
        var variavel=prompt("Digite o valor da variavel")
        var variavel2=prompt("Digite o valor da variavel2")

        variavel= parseInt(variavel)// retorna o valor como do tipo numero inteiro se fosse float seria um numero fracionado
        variavel2=parseInt(variavel2)
        document.write(variavel.toString() + variavel2.toString())// toString transforma para o tipo string
    </script>
    
</body>
</html>
