<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
    

    for(var x=1;x<11;x++){
        for(y=0;y<11;y++){
            document.write(x+"x"+y+"="+x*y+"<br>")
            if(y==10){
                document.write("<hr><hr>")
            }
        }
    }
    </script>
    
</body>
</html>
